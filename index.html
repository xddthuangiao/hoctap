<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Học tập trực tuyến</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  /* Trang vỏ dùng chung cho mọi đợt học – Bộ công cụ học tập trực tuyến v1.1 */
  :root { --nen: #f0ebf8; --xanh: #1e8a5a; --vang: #c9a227; --chu: #1f2a44; --nhat: #5f6b7a; --vien: #e3e6ea; }
  html, body { margin: 0; height: 100%; background: var(--nen); font-family: Roboto, Arial, sans-serif; color: var(--chu); }
  #dau { display: none; position: fixed; top: 0; left: 0; right: 0; z-index: 2; background: var(--nen); padding: 12px 12px 0; box-sizing: border-box; }
  #dau img, #p_banner { display: block; width: 100%; max-width: 770px; margin: 0 auto; border-radius: 8px; }
  #p_banner { display: none; margin-bottom: 20px; }
  #khung { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; display: block; background: var(--nen); }
  #phieu { display: none; min-height: 100%; background: #fff; }
  #phieu .the { max-width: 760px; margin: 0 auto; padding: 32px 20px 40px; box-sizing: border-box; }
  .dau { width: 64px; height: 64px; border-radius: 50%; background: var(--xanh); margin: 8px auto 12px;
         display: flex; align-items: center; justify-content: center; }
  .dau svg { width: 36px; height: 36px; }
  .ghinhan { text-align: center; color: var(--xanh); font-weight: 700; font-size: 26px; letter-spacing: .3px; margin: 0; }
  .tieude { text-align: center; font-weight: 700; font-size: 22px; margin: 10px 0 18px; }
  .gach { height: 3px; background: var(--vang); border: 0; margin: 0 0 6px; }
  .muc { padding: 16px 0 14px; border-bottom: 1px solid var(--vien); }
  .nhan { font-size: 13px; font-weight: 500; color: var(--nhat); text-transform: uppercase; letter-spacing: .4px; }
  .gt { font-size: 22px; font-weight: 700; margin-top: 6px; line-height: 1.3; overflow-wrap: anywhere; }
  .gt.dot { text-transform: uppercase; font-size: 24px; }
  .chuthich { text-align: center; color: var(--nhat); font-size: 15px; line-height: 1.6; margin-top: 36px; white-space: pre-line; }
  .luotmoi { display: block; text-align: center; margin-top: 28px; font-size: 13px; color: var(--nhat); }
  .luotmoi button { background: none; border: 0; color: inherit; text-decoration: underline; cursor: pointer; font: inherit; padding: 8px; }
  #baoloi { display: none; max-width: 640px; margin: 15vh auto 0; padding: 24px; background: #fff; border-radius: 8px;
            text-align: center; line-height: 1.6; box-sizing: border-box; }
  @media (max-width: 480px) { .ghinhan { font-size: 21px; } .tieude { font-size: 18px; } .gt { font-size: 19px; } .gt.dot { font-size: 19px; } }
  .luu { text-align: center; margin-top: 28px; }
  .luu button { background: var(--xanh); color: #fff; border: 0; border-radius: 6px; font: 500 16px Roboto, Arial, sans-serif;
                padding: 12px 22px; cursor: pointer; }
  .luu button:disabled { opacity: .6; cursor: default; }
  #xemanh { display: none; position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 10; overflow: auto; text-align: center; padding: 16px; box-sizing: border-box; }
  #xemanh p { color: #fff; font-size: 15px; margin: 8px 0 12px; }
  #xemanh img { max-width: 100%; height: auto; background: #fff; }
  #xemanh button { margin-top: 12px; background: #fff; border: 0; border-radius: 6px; padding: 10px 20px; font: inherit; cursor: pointer; }
</style>
</head>
<body>
<div id="dau"><img id="anhdau" alt=""></div>
<iframe id="khung" title="Biểu mẫu học tập" allow="clipboard-write"></iframe>

<main id="phieu" aria-live="polite">
  <div class="the">
    <img id="p_banner" alt="">
    <div class="dau" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>
    </div>
    <h1 class="ghinhan">ĐÃ GHI NHẬN HOÀN THÀNH</h1>
    <div class="tieude">PHIẾU XÁC NHẬN HỌC TẬP</div>
    <hr class="gach">
    <div class="muc"><div class="nhan">Đợt học tập</div><div class="gt dot" id="p_dot"></div></div>
    <div class="muc"><div class="nhan">Họ và tên</div><div class="gt" id="p_ten"></div></div>
    <div class="muc"><div class="nhan">Tổ chức đảng</div><div class="gt" id="p_tcd"></div></div>
    <div class="muc" id="m_cv"><div class="nhan">Chức vụ trong Đảng</div><div class="gt" id="p_cv"></div></div>
    <div class="muc"><div class="nhan">Thời gian hoàn thành</div><div class="gt" id="p_tg"></div></div>
    <div class="chuthich" id="p_ct"></div>
    <div class="luu"><button type="button" id="nut_luu">Lưu ảnh phiếu xác nhận</button></div>
    <div class="luotmoi"><button type="button" id="nut_moi">Người khác học trên thiết bị này? Bắt đầu lượt học mới</button></div>
  </div>
</main>

<div id="baoloi"></div>
<div id="xemanh"><p>Nhấn giữ vào ảnh (điện thoại) hoặc nhấp chuột phải → Lưu hình ảnh (máy tính) để lưu phiếu.</p><img id="anhphieu" alt="Phiếu xác nhận học tập"><br><button type="button" id="nut_dong">Đóng</button></div>

<script>
(function () {
  'use strict';
  var P = new URLSearchParams(location.search);
  var DOT = (P.get('d') || '').toUpperCase();
  var FORM = P.get('f') || '';
  var ENTRY = P.get('e') || '';
  var SO_LAN_GUI = parseInt(P.get('n') || '0', 10);
  var MAU = (P.get('c') || '').replace(/[^0-9a-fA-F]/g, '');
  var API = P.get('api') || (P.get('a') ? 'https://script.google.com/macros/s/' + P.get('a') + '/exec' : '');
  var NGUON_FORM = P.get('fs') || ('https://docs.google.com/forms/d/e/' + FORM + '/viewform');

  var khung = document.getElementById('khung');
  var phieu = document.getElementById('phieu');
  if (MAU.length === 6) document.documentElement.style.setProperty('--nen', '#' + MAU);

  function baoLoi(t) {
    khung.style.display = 'none';
    var b = document.getElementById('baoloi');
    b.textContent = t; b.style.display = 'block';
  }
  if (!/^[A-Z0-9]{2,10}$/.test(DOT) || !(FORM || P.get('fs')) || !/^\d+$/.test(ENTRY) || !SO_LAN_GUI || !API) {
    baoLoi('Đường link học tập chưa đầy đủ. Đề nghị đồng chí mở lại đường link do tổ chức đảng gửi.');
    return;
  }

  // ---- Bộ nhớ trên thiết bị (bọc try/catch vì có trình duyệt chặn) ----
  var KHOA = 'hoctap_' + DOT;
  function doc() { try { return JSON.parse(localStorage.getItem(KHOA) || '{}'); } catch (e) { return {}; } }
  function ghi(o) { try { localStorage.setItem(KHOA, JSON.stringify(o)); } catch (e) {} }
  function xoa() { try { localStorage.removeItem(KHOA); } catch (e) {} }

  function taoMa() {
    var kt = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789', s = '';
    var buf = new Uint32Array(8);
    (window.crypto || window.msCrypto).getRandomValues(buf);
    for (var i = 0; i < 8; i++) s += kt[buf[i] % kt.length];
    return DOT + '-' + s;
  }

  // ---- Gọi máy chủ kiểu JSONP (không vướng chặn tên miền chéo) ----
  var dem = 0;
  function goi(thamSo, xong) {
    var ten = '__ht' + (++dem) + '_' + Date.now();
    var the = document.createElement('script');
    var hetGio = setTimeout(function () { donDep(); xong(null); }, 8000);
    function donDep() { clearTimeout(hetGio); try { delete window[ten]; } catch (e) { window[ten] = undefined; } if (the.parentNode) the.parentNode.removeChild(the); }
    window[ten] = function (kq) { donDep(); xong(kq); };
    var q = [];
    for (var k in thamSo) q.push(encodeURIComponent(k) + '=' + encodeURIComponent(thamSo[k]));
    q.push('callback=' + ten);
    the.src = API + (API.indexOf('?') >= 0 ? '&' : '?') + q.join('&');
    the.onerror = function () { donDep(); xong(null); };
    document.body.appendChild(the);
  }

  // ---- Hiển thị phiếu ----
  function hienPhieu(kq) {
    document.getElementById('p_dot').textContent = kq.ten_dot || '';
    document.getElementById('p_ten').textContent = kq.ho_ten || '';
    document.getElementById('p_tcd').textContent = kq.to_chuc || '';
    document.getElementById('p_cv').textContent = kq.chuc_vu || '';
    document.getElementById('m_cv').style.display = kq.chuc_vu ? '' : 'none';
    document.getElementById('p_tg').textContent = kq.thoi_gian || '';
    document.getElementById('p_ct').textContent = kq.chu_thich || '';
    if (kq.ten_dot) document.title = kq.ten_dot;
    khung.style.display = 'none';
    document.getElementById('dau').style.display = 'none';
    khung.removeAttribute('src');
    phieu.style.display = 'block';
    document.body.style.background = '#fff';
    window.scrollTo(0, 0);
  }
  document.getElementById('nut_moi').addEventListener('click', function () { xoa(); location.reload(); });

  // ---- Lưu ảnh phiếu (vẽ trực tiếp, không cần thư viện ngoài) ----
  function boDau(s) { return String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/đ/g, 'd').replace(/Đ/g, 'D').replace(/[^A-Za-z0-9]+/g, '_').replace(/^_|_$/g, ''); }
  function chiaDong(ctx, chu, rong) {
    var ra = [];
    String(chu).split('\n').forEach(function (doan) {
      var tu = doan.split(' '), dong = '';
      tu.forEach(function (w) {
        var thu = dong ? dong + ' ' + w : w;
        if (ctx.measureText(thu).width > rong && dong) { ra.push(dong); dong = w; } else dong = thu;
      });
      ra.push(dong);
    });
    return ra;
  }
  function veAnhPhieu() {
    var W = 1080, L = 72, R = W - 72, RONG = R - L, F = 'Roboto, Arial, sans-serif';
    var muc = [['ĐỢT HỌC TẬP', 'p_dot', true], ['HỌ VÀ TÊN', 'p_ten'], ['TỔ CHỨC ĐẢNG', 'p_tcd'], ['CHỨC VỤ TRONG ĐẢNG', 'p_cv'], ['THỜI GIAN HOÀN THÀNH', 'p_tg']]
      .map(function (m) { var v = document.getElementById(m[1]).textContent.trim(); return { nhan: m[0], gt: m[2] ? v.toUpperCase() : v }; })
      .filter(function (m) { return m.gt; });
    var ct = document.getElementById('p_ct').textContent.trim();
    var cv = document.createElement('canvas'), ctx = cv.getContext('2d');
    var pb = document.getElementById('p_banner'), veAnh = false, caoAnh = 0;
    try { veAnh = pb.style.display === 'block' && pb.naturalWidth > 0 && new URL(pb.src).origin === location.origin; } catch (e) {}
    if (veAnh) caoAnh = Math.round(RONG * pb.naturalHeight / pb.naturalWidth);
    function bo(ve) {
      var y = 64;
      if (veAnh) { if (ve) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, cv.height); ctx.drawImage(pb, L, y, RONG, caoAnh); } y += caoAnh + 40; }
      if (ve) { if (!veAnh) { ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, W, cv.height); }
        ctx.fillStyle = '#1e8a5a'; ctx.beginPath(); ctx.arc(W / 2, y + 56, 56, 0, Math.PI * 2); ctx.fill();
        ctx.strokeStyle = '#fff'; ctx.lineWidth = 11; ctx.lineCap = 'round'; ctx.lineJoin = 'round';
        ctx.beginPath(); ctx.moveTo(W / 2 - 25, y + 58); ctx.lineTo(W / 2 - 6, y + 77); ctx.lineTo(W / 2 + 28, y + 38); ctx.stroke(); }
      y += 112 + 72;
      ctx.textAlign = 'center'; ctx.textBaseline = 'alphabetic';
      ctx.font = '700 50px ' + F; if (ve) { ctx.fillStyle = '#1e8a5a'; ctx.fillText('ĐÃ GHI NHẬN HOÀN THÀNH', W / 2, y); }
      y += 64; ctx.font = '700 40px ' + F; if (ve) { ctx.fillStyle = '#1f2a44'; ctx.fillText('PHIẾU XÁC NHẬN HỌC TẬP', W / 2, y); }
      y += 36; if (ve) { ctx.fillStyle = '#c9a227'; ctx.fillRect(L, y, RONG, 5); }
      y += 5;
      ctx.textAlign = 'left';
      muc.forEach(function (m, i) {
        y += 52; ctx.font = '500 26px ' + F; if (ve) { ctx.fillStyle = '#5f6b7a'; ctx.fillText(m.nhan, L, y); }
        ctx.font = '700 ' + (i === 0 ? 44 : 42) + 'px ' + F;
        chiaDong(ctx, m.gt, RONG).forEach(function (d) { y += 58; if (ve) { ctx.fillStyle = '#1f2a44'; ctx.fillText(d, L, y); } });
        y += 30; if (ve) { ctx.fillStyle = '#e3e6ea'; ctx.fillRect(L, y, RONG, 2); }
      });
      if (ct) { y += 40; ctx.textAlign = 'center'; ctx.font = '400 28px ' + F;
        chiaDong(ctx, ct, RONG).forEach(function (d) { y += 44; if (ve) { ctx.fillStyle = '#5f6b7a'; ctx.fillText(d, W / 2, y); } }); }
      return y + 64;
    }
    cv.width = W; cv.height = 10; cv.height = bo(false); bo(true);
    return cv;
  }
  function hienAnh(url) {
    document.querySelector('#xemanh p').textContent = 'Nhấn giữ vào ảnh (điện thoại) hoặc nhấp chuột phải → Lưu hình ảnh (máy tính) để lưu phiếu.';
    document.getElementById('anhphieu').src = url;
    document.getElementById('xemanh').style.display = 'block';
  }
  document.getElementById('nut_dong').addEventListener('click', function () { document.getElementById('xemanh').style.display = 'none'; });
  document.getElementById('nut_luu').addEventListener('click', function () {
    var cho = (document.fonts && document.fonts.ready) ? document.fonts.ready : Promise.resolve();
    cho.then(function () {
      var canvas;
      try { canvas = veAnhPhieu(); } catch (e) { alertNhe('Không tạo được ảnh. Đồng chí chụp màn hình để lưu phiếu.'); return; }
      var tenTep = 'Phieu_' + DOT + '_' + (boDau(document.getElementById('p_ten').textContent) || 'xac_nhan') + '.png';
      canvas.toBlob(function (blob) {
        if (!blob) { hienAnh(canvas.toDataURL('image/png')); return; }
        var tep = null;
        try { tep = new File([blob], tenTep, { type: 'image/png' }); } catch (e) {}
        var dt = /Android|iPhone|iPad/i.test(navigator.userAgent);
        // Điện thoại: mở bảng chia sẻ để lưu vào Ảnh hoặc gửi qua Zalo
        if (dt && tep && navigator.canShare && navigator.canShare({ files: [tep] })) {
          navigator.share({ files: [tep], title: 'Phiếu xác nhận học tập' }).catch(function (e) { if (!e || e.name !== 'AbortError') hienAnh(URL.createObjectURL(blob)); });
          return;
        }
        var url = URL.createObjectURL(blob);
        if (dt) { hienAnh(url); return; } // trình duyệt điện thoại không chia sẻ được: hiện ảnh để nhấn giữ lưu
        // Máy tính: tải tệp về thư mục Tải xuống
        var a = document.createElement('a'); a.href = url; a.download = tenTep;
        document.body.appendChild(a); a.click(); a.remove();
      }, 'image/png');
    });
  });
  function alertNhe(t) { var p = document.querySelector('#xemanh p'); p.textContent = t; document.getElementById('anhphieu').removeAttribute('src'); document.getElementById('xemanh').style.display = 'block'; }

  // ---- Ảnh đầu trang riêng của trang vỏ: chỉ dùng khi gắn tham số b=banner.png (mặc định Form mở ở chế độ thường, Google tự hiện ảnh đầu trang) ----
  var dau = document.getElementById('dau'), anhDau = document.getElementById('anhdau'), coAnhDau = false;
  function canKhung() {
    var hien = coAnhDau && (soLanTai || 0) < 2 && phieu.style.display !== 'block';
    dau.style.display = hien ? 'block' : 'none';
    var cao = hien ? dau.offsetHeight : 0;
    khung.style.top = cao + 'px'; khung.style.height = 'calc(100% - ' + cao + 'px)';
  }
  var nguonAnh = P.get('b') || '0'; // mặc định tắt: ảnh đầu trang do Google Form hiển thị (chế độ thường)
  if (nguonAnh !== '0') {
    anhDau.onload = function () {
      coAnhDau = true;
      var pb = document.getElementById('p_banner'); pb.src = anhDau.src; pb.style.display = 'block';
      canKhung();
    };
    anhDau.src = nguonAnh;
  }
  window.addEventListener('resize', canKhung);

  var luu = doc();
  if (luu.phieu) { hienPhieu(luu.phieu); return; }

  var MA = luu.ma && new RegExp('^' + DOT + '-[A-Z0-9]{8}$').test(luu.ma) ? luu.ma : taoMa();
  ghi({ ma: MA });

  // ---- Nạp Form ----
  var src = NGUON_FORM + (NGUON_FORM.indexOf('?') >= 0 ? '&' : '?') +
    (P.get('nhung') === '1' ? 'embedded=true&' : '') + 'usp=pp_url&entry.' + ENTRY + '=' + encodeURIComponent(MA);
  khung.src = src;

  // Tên tab: lấy từ tham số t= của link (nếu có); không gọi máy chủ khi mở link để giảm tải
  if (P.get('t')) document.title = P.get('t');

  // ---- Theo dõi lúc gửi ----
  var soLanTai = 0, daXong = false, dangDo = false;
  // Lịch tra phiếu sau khi gửi (mili giây, cộng dồn); có độ lệch ngẫu nhiên để nhiều người gửi cùng lúc không dồn vào một thời điểm
  var LICH = [1500, 3500, 6000, 9500, 14000, 20000, 28000, 38000, 50000, 65000, 80000];
  function doTim(lan) {
    if (daXong || lan >= LICH.length) { dangDo = false; return; }
    setTimeout(function () {
      if (daXong) return;
      goi({ d: DOT, ma: MA, loai: 'phieu' }, function (kq) {
        if (kq && kq.ok) {
          daXong = true;
          ghi({ phieu: kq });
          hienPhieu(kq);
        } else {
          doTim(lan + 1);
        }
      });
    }, (function () { var k = lan === 0 ? LICH[0] : LICH[lan] - LICH[lan - 1]; return k * (0.7 + Math.random() * 0.6); })()); // lệch ngẫu nhiên ±30%
  }
  khung.addEventListener('load', function () {
    soLanTai++;
    canKhung();
    if (soLanTai >= SO_LAN_GUI && !daXong && !dangDo) { dangDo = true; doTim(0); }
  });
})();
</script>
</body>
</html>
